server:
  port: 8765
  # Token required on mutating requests (book, release, add/edit devices…).
  # Set to "" or omit to disable token checking (recommended for internal deployments).
  token: ""
  db_path: "./boardfarm.db"
  admin_users:
    - "admin"
  # Maximum booking duration. Options:
  #   <positive integer>  – cap in hours (default: 24)
  #   null                – unlimited (user chooses any duration)
  #   0                   – bookings never expire (permanent until released)
  max_booking_hours: 24
  # Default username pre-filled in the UI's action forms (null = no default)
  default_user: null
  # Application name shown in the UI header
  # app_name: "BOARDFARM: a LAB INVENTORY and BOOKING SYSTEM"
